spring.application.name=spring-boot-jpa-rest-api

spring.datasource.url=jdbc:mysql://localhost:3306/rabtech_business_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-a-long-random-value}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.jpa.open-in-view=false
